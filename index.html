<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conduit to Cable Sizer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
      --error-color: #ef4444;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 900px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--accent-color);
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      margin-bottom: 18px;
      transition: all 0.3s ease;
    }

    .form-group.hidden {
      display: none !important;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    /* Alternating background colors for dropdown options */
    select option:nth-child(odd) {
      background-color: #1e293b;
      color: #f8fafc;
    }

    select option:nth-child(even) {
      background-color: #0f172a;
      color: #38bdf8;
    }

    .radio-group-container {
      background-color: #0f172a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .radio-group-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .radio-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .radio-option input[type="radio"] {
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .unit-input-group {
      display: flex;
      gap: 10px;
    }

    .unit-input-group input {
      flex: 1;
    }

    .unit-input-group select {
      width: 90px;
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.8rem;
      margin-top: 4px;
      display: none;
    }

    .result-card {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 12px;
      text-align: center;
    }

    .result-detail {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      width: 100%;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    canvas {
      background: #020617;
      border-radius: 50%;
      border: 2px solid var(--border-color);
    }

    .cec-badge {
      display: inline-block;
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning-color);
      border: 1px solid var(--warning-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Conduit to Cable Sizer</h1>
  <p class="subtitle">CEC Compliant Conduit Fill Calculator<br/>Copyright (c) 2026 Shane McDonald. All rights reserved.</p>

  <div class="grid-layout">
    <div class="controls-column">
      
      <!-- Radio Group: Calculation Selection -->
      <div class="radio-group-container">
        <div class="radio-group-title">What are we Calculating?</div>
        <div class="radio-options" id="cable_selection">
          <label class="radio-option">
            <input type="radio" name="calc_mode" value="conduit" checked>
            Minimum Conduit Size
          </label>
          <label class="radio-option">
            <input type="radio" name="calc_mode" value="cables">
            Max Number of Cables
          </label>
          <label class="radio-option">
            <input type="radio" name="calc_mode" value="diameter">
            Max Cable Diameter
          </label>
        </div>
      </div>

      <!-- Input: Number of Cables -->
      <div class="form-group" id="group_cable_number">
        <label for="cable_number">Number of Cables</label>
        <input type="number" id="cable_number" min="1" max="200" value="3" step="1">
        <div class="error-msg" id="err_cable_number">Must be a number between 1 and 200 (CEC Max).</div>
      </div>

      <!-- Input: Cable Diameter & Unit -->
      <div class="form-group" id="group_cable_diameter">
        <label for="cable_diameter">Cable Diameter</label>
        <div class="unit-input-group">
          <input type="number" id="cable_diameter" min="0.01" step="0.01" value="10">
          <select id="cable_unit">
            <option value="mm">mm</option>
            <option value="inch">inch</option>
          </select>
        </div>
        <div class="error-msg" id="err_cable_diameter">Must be a number greater than 0.</div>
      </div>

      <!-- Select: EMT Size Dropdown -->
      <div class="form-group hidden" id="group_conduit_size">
        <label for="conduit_size">EMT Conduit Trade Size</label>
        <select id="conduit_size">
          <option value="0">16 (1/2")</option>
          <option value="1">21 (3/4")</option>
          <option value="2">27 (1")</option>
          <option value="3">35 (1-1/4")</option>
          <option value="4">41 (1-1/2")</option>
          <option value="5">53 (2")</option>
          <option value="6">63 (2-1/2")</option>
          <option value="7">78 (3")</option>
          <option value="8">91 (3-1/2")</option>
          <option value="9">103 (4")</option>
          <option value="10">129 (5")</option>
          <option value="11">155 (6")</option>
        </select>
      </div>

    </div>

    <!-- Output & Visualization Column -->
    <div class="results-column">
      <div class="result-card">
        <div class="result-title" id="result_label">Minimum Conduit Size</div>
        <div class="result-value" id="result_output">--</div>
        <div class="result-detail" id="result_detail">Fill out parameters to calculate.</div>
        <div id="cec_warning_container"></div>

        <div class="canvas-container">
          <canvas id="crossSectionCanvas" width="220" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Data Tables from CEC standard guidelines
  const CONDUIT_DATA = [
    { metric: 16,  trade: '1/2"',   area1: 98.72,   area2: 57.74,   area3: 74.51 },
    { metric: 21,  trade: '3/4"',   area1: 174.93,  area2: 102.32,  area3: 132.03 },
    { metric: 27,  trade: '1"',     area1: 285.74,  area2: 167.13,  area3: 215.65 },
    { metric: 35,  trade: '1-1/4"', area1: 498.33,  area2: 291.48,  area3: 376.10 },
    { metric: 41,  trade: '1-1/2"', area1: 682.77,  area2: 399.36,  area3: 515.30 },
    { metric: 53,  trade: '2"',     area1: 1129.90, area2: 660.89,  area3: 852.76 },
    { metric: 63,  trade: '2-1/2"', area1: 2004.86, area2: 1172.66, area3: 1513.10 },
    { metric: 78,  trade: '3"',     area1: 3021.66, area2: 1767.38, area3: 2280.49 },
    { metric: 91,  trade: '3-1/2"', area1: 3948.97, area2: 2309.77, area3: 2980.35 },
    { metric: 103, trade: '4"',     area1: 5036.76, area2: 2946.03, area3: 3801.33 },
    { metric: 129, trade: '5"',     area1: 6916.00, area2: 4045.00, area3: 5520.00 },
    { metric: 155, trade: '6"',     area1: 9975.00, area2: 5834.00, area3: 7528.00 }
  ];

  // DOM Elements
  const cableNumberInput = document.getElementById('cable_number');
  const cableDiameterInput = document.getElementById('cable_diameter');
  const cableUnitSelect = document.getElementById('cable_unit');
  const conduitSizeSelect = document.getElementById('conduit_size');
  
  const groupCableNumber = document.getElementById('group_cable_number');
  const groupCableDiameter = document.getElementById('group_cable_diameter');
  const groupConduitSize = document.getElementById('group_conduit_size');

  const errCableNumber = document.getElementById('err_cable_number');
  const errCableDiameter = document.getElementById('err_cable_diameter');

  const resultLabel = document.getElementById('result_label');
  const resultOutput = document.getElementById('result_output');
  const resultDetail = document.getElementById('result_detail');
  const cecWarningContainer = document.getElementById('cec_warning_container');
  const canvas = document.getElementById('crossSectionCanvas');
  const ctx = canvas.getContext('2d');

  function getAllowableArea(conduitIndex, cableCount) {
    const row = CONDUIT_DATA[conduitIndex];
    if (cableCount === 1) return row.area1;
    if (cableCount === 2) return row.area2;
    return row.area3; // 3 or more cables
  }

  function getSelectedMode() {
    return document.querySelector('input[name="calc_mode"]:checked').value;
  }

  function updateVisibility() {
    const mode = getSelectedMode();

    // Default: show all
    groupCableNumber.classList.remove('hidden');
    groupCableDiameter.classList.remove('hidden');
    groupConduitSize.classList.remove('hidden');

    // Hide the input corresponding to what we are solving for
    if (mode === 'conduit') {
      groupConduitSize.classList.add('hidden');
      resultLabel.textContent = 'Minimum Conduit Size';
    } else if (mode === 'cables') {
      groupCableNumber.classList.add('hidden');
      resultLabel.textContent = 'Max Number of Cables';
    } else if (mode === 'diameter') {
      groupCableDiameter.classList.add('hidden');
      resultLabel.textContent = 'Max Cable Diameter';
    }

    calculate();
  }

  function calculate() {
    cecWarningContainer.innerHTML = '';
    const mode = getSelectedMode();
    const unit = cableUnitSelect.value;
    
    let numCables = parseInt(cableNumberInput.value, 10);
    let dia = parseFloat(cableDiameterInput.value);

    // Validate inputs based on visibility
    let valid = true;

    if (!groupCableNumber.classList.contains('hidden')) {
      if (isNaN(numCables) || numCables < 1 || numCables > 200) {
        errCableNumber.style.display = 'block';
        valid = false;
      } else {
        errCableNumber.style.display = 'none';
      }
    }

    if (!groupCableDiameter.classList.contains('hidden')) {
      if (isNaN(dia) || dia <= 0) {
        errCableDiameter.style.display = 'block';
        valid = false;
      } else {
        errCableDiameter.style.display = 'none';
      }
    }

    if (!valid) {
      resultOutput.textContent = '--';
      resultDetail.textContent = 'Please fix input errors above.';
      drawCrossSection(0, 0, 0);
      return;
    }

    // Convert diameter to mm for internal calculations
    let diaMM = dia;
    if (unit === 'inch' && !isNaN(dia)) {
      diaMM = dia * 25.4;
    }

    if (mode === 'conduit') {
      const singleCableArea = Math.PI * Math.pow(diaMM / 2, 2);
      const totalCableArea = numCables * singleCableArea;

      let foundIndex = -1;
      for (let i = 0; i < CONDUIT_DATA.length; i++) {
        const allowArea = getAllowableArea(i, numCables);
        if (allowArea >= totalCableArea) {
          foundIndex = i;
          break;
        }
      }

      if (foundIndex !== -1) {
        const c = CONDUIT_DATA[foundIndex];
        resultOutput.textContent = `${c.metric} mm (${c.trade})`;
        resultDetail.innerHTML = `
          Total Cable Area: <strong>${totalCableArea.toFixed(1)} mm²</strong><br>
          Allowable Area: <strong>${getAllowableArea(foundIndex, numCables).toFixed(1)} mm²</strong>
        `;
        drawCrossSection(foundIndex, numCables, diaMM);
      } else {
        resultOutput.textContent = 'Exceeds Standard EMT';
        resultDetail.textContent = 'Required area exceeds maximum standard EMT conduit capacity.';
        drawCrossSection(CONDUIT_DATA.length - 1, numCables, diaMM);
      }

    } else if (mode === 'cables') {
      const conduitIdx = parseInt(conduitSizeSelect.value, 10);
      const singleCableArea = Math.PI * Math.pow(diaMM / 2, 2);

      let maxCount = 0;
      for (let count = 1; count <= 200; count++) {
        const allowArea = getAllowableArea(conduitIdx, count);
        if (count * singleCableArea <= allowArea) {
          maxCount = count;
        } else {
          break;
        }
      }

      if (maxCount >= 200) {
        maxCount = 200;
        cecWarningContainer.innerHTML = '<span class="cec-badge">CEC Limit Reached (200 Cables Max)</span>';
      }

      const c = CONDUIT_DATA[conduitIdx];
      resultOutput.textContent = `${maxCount} Cables`;
      resultDetail.innerHTML = `
        Conduit: <strong>${c.metric} mm (${c.trade})</strong><br>
        Cable Dia: <strong>${dia} ${unit}</strong>
      `;
      drawCrossSection(conduitIdx, maxCount, diaMM);

    } else if (mode === 'diameter') {
      const conduitIdx = parseInt(conduitSizeSelect.value, 10);
      const allowArea = getAllowableArea(conduitIdx, numCables);
      
      const maxSingleArea = allowArea / numCables;
      const maxDiaMM = 2 * Math.sqrt(maxSingleArea / Math.PI);
      const displayDia = (unit === 'inch') ? (maxDiaMM / 25.4) : maxDiaMM;

      const c = CONDUIT_DATA[conduitIdx];
      resultOutput.textContent = `${displayDia.toFixed(2)} ${unit}`;
      resultDetail.innerHTML = `
        Conduit: <strong>${c.metric} mm (${c.trade})</strong><br>
        Number of Cables: <strong>${numCables}</strong>
      `;
      drawCrossSection(conduitIdx, numCables, maxDiaMM);
    }
  }

  function drawCrossSection(conduitIndex, count, cableDiaMM) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const canvasRadius = 90;

    // Outer Conduit Circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, canvasRadius, 0, 2 * Math.PI);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#38bdf8';
    ctx.stroke();

    if (count <= 0 || cableDiaMM <= 0) return;

    // Proportional scaling radius
    const total100PercentArea = CONDUIT_DATA[conduitIndex].area1 / 0.53;
    const conduitInnerRadiusMM = Math.sqrt(total100PercentArea / Math.PI);
    const scale = canvasRadius / conduitInnerRadiusMM;
    const cableRadiusPx = (cableDiaMM / 2) * scale;

    // Non-overlapping concentric packing
    const positions = [];
    let placed = 0;
    
    if (count >= 1) {
      positions.push({ x: centerX, y: centerY });
      placed = 1;
    }

    let ring = 1;
    while (placed < count && ring < 15) {
      const dist = ring * (cableRadiusPx * 2.05);
      const circumference = 2 * Math.PI * dist;
      const fitInRing = Math.floor(circumference / (cableRadiusPx * 2.05));
      const ringCount = Math.min(count - placed, Math.max(1, fitInRing));

      for (let i = 0; i < ringCount; i++) {
        const angle = (i / ringCount) * 2 * Math.PI;
        const px = centerX + dist * Math.cos(angle);
        const py = centerY + dist * Math.sin(angle);
        
        // Ensure within conduit wall
        const distFromCenter = Math.sqrt(Math.pow(px - centerX, 2) + Math.pow(py - centerY, 2));
        if (distFromCenter + cableRadiusPx <= canvasRadius) {
          positions.push({ x: px, y: py });
        }
      }
      placed = positions.length;
      ring++;
    }

    // Render cables
    positions.forEach(pos => {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, Math.max(1, cableRadiusPx), 0, 2 * Math.PI);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#78350f';
      ctx.stroke();

      // Inner conductor core
      if (cableRadiusPx > 4) {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, cableRadiusPx * 0.4, 0, 2 * Math.PI);
        ctx.fillStyle = '#b45309';
        ctx.fill();
      }
    });
  }

  // Event Listeners
  document.querySelectorAll('input[name="calc_mode"]').forEach(radio => {
    radio.addEventListener('change', updateVisibility);
  });

  cableNumberInput.addEventListener('input', calculate);
  cableDiameterInput.addEventListener('input', calculate);
  cableUnitSelect.addEventListener('change', calculate);
  conduitSizeSelect.addEventListener('change', calculate);

  // Initialize
  updateVisibility();
</script>

</body>
</html>
